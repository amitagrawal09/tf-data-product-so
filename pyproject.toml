[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfso"
version = "1.0.0"
description = "Taylor Farms Sales Order data product - Experience, Process (Order Status) and System APIs"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "SQLAlchemy>=2.0",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.8",
  "openpyxl>=3.1",
  "pypdf>=4.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
azure = [
  "psycopg[binary]>=3.1",
  "azure-identity>=1.15",
  "azure-servicebus>=7.11",
  "azure-eventhub>=5.11",
  "azure-storage-file-datalake>=12.14",
  "azure-monitor-opentelemetry>=1.3",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tfso.system" = ["seed/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
