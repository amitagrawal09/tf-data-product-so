<!-- ===================== D2: GetOrderStatus request flow ===================== -->
<svg id="d2" width="1100" height="430" viewBox="0 0 1100 430" xmlns="http://www.w3.org/2000/svg">

  <!-- lifelines -->

    <rect x="490" y="48" width="200" height="40" rx="7" fill="#fff" stroke="#2b7a3d"/><text x="590" y="68" text-anchor="middle" class="l">Process API</text><text x="590" y="82" text-anchor="middle" class="xs">Container App (FastAPI)</text>
    <rect x="750" y="48" width="200" height="40" rx="7" fill="#fff" stroke="#d9a441"/><text x="850" y="68" text-anchor="middle" class="l">PostgreSQL</text><text x="850" y="82" text-anchor="middle" class="xs">sales_orders · order_history</text>
  </g>
  <path d="M110,88 V410 M340,88 V410 M590,88 V410 M850,88 V410" stroke="#c9d2cc" stroke-dasharray="4 4"/>
  <path class="edge2" d="M110,115 H335" marker-end="url(#b)"/><text x="118" y="108" class="xs">GET /process/v1/orders/{id}/status · Ocp-Apim-Subscription-Key</text>
  <rect x="345" y="122" width="230" height="78" rx="6" fill="#f1f8f2" stroke="#b9d9bf"/>
  <text x="352" y="139" class="xs">• validate subscription key / JWT</text><text x="352" y="154" class="xs">• rate-limit 600/min · quota (product)</text>
  <text x="352" y="169" class="xs">• set x-correlation-id · CORS</text><text x="352" y="184" class="xs">• inject backend x-api-key (Key Vault)</text>
  <text x="352" y="196" class="xs">• Order Status product: GET only (405)</text>
  <path class="edge2" d="M340,215 H585" marker-end="url(#b)"/><text x="350" y="210" class="xs">forward (TLS) + x-api-key</text>
  <rect x="595" y="222" width="150" height="48" rx="6" fill="#f1f8f2" stroke="#b9d9bf"/><text x="602" y="240" class="xs">auth middleware</text><text x="602" y="254" class="xs">views.status_view()</text><text x="602" y="266" class="xs">scope filters → SQL</text>
  <path class="edge2" d="M590,285 H845" marker-end="url(#b)"/><text x="600" y="280" class="xs">SELECT by PK / indexed projection</text>
  <path class="edge" d="M850,310 H595" marker-end="url(#b2)"/><text x="660" y="305" class="xs">order doc (JSONB) + last history row</text>
  <rect x="595" y="318" width="150" height="34" rx="6" fill="#f1f8f2" stroke="#b9d9bf"/><text x="602" y="333" class="xs">build milestones, lines,</text><text x="602" y="346" class="xs">shipments; ETag = version</text>
  <path class="edge" d="M590,370 H345" marker-end="url(#b2)"/><text x="360" y="365" class="xs">200 OrderStatusView · ETag · x-correlation-id</text>
  <path class="edge" d="M340,395 H115" marker-end="url(#b2)"/><text x="125" y="390" class="xs">200 (or RFC 7807 problem: 401/404/429)</text>
  <text x="960" y="130" class="xs">Typical latency</text><text x="960" y="145" class="xs">p95 &lt; 300 ms</text>
  <text x="960" y="175" class="xs">Writes never</text><text x="960" y="190" class="xs">happen on this</text><text x="960" y="205" class="xs">path (CQRS-style</text><text x="960" y="220" class="xs">read projection)</text>
</svg>
